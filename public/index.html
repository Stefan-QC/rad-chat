<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAD Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/join.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/rail.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/messages.css">
<link rel="stylesheet" href="css/composer.css">
<link rel="stylesheet" href="css/members.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Qualogy-style mark: red disc, white Q, thin arcs -->
    <symbol id="logo" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="16" fill="#D71920"/>
      <circle cx="30" cy="34" r="22" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.2"/>
      <circle cx="36" cy="28" r="20" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.2"/>
      <circle cx="32" cy="32" r="14" fill="none" stroke="#fff" stroke-width="5"/>
      <path d="M33 33 L44 44" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10.1 15 12 3.4 13.9z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path fill="currentColor" d="M16 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.300 0-7 1.200-7 3.500V19h14v-2.500C15 14.200 10.300 13 8 13zm8 0c-.300 0-.600 0-1 .100 1.200.800 2 1.900 2 3.400V19h6v-2.500c0-2.300-4.700-3.500-7-3.500z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 3 7v10l9 5 9-5V7zm0 2.3L18.800 8 12 11.700 5.200 8zM5 9.700l6 3.300v6.800l-6-3.300zm8 10.100v-6.800l6-3.300v6.800z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="currentColor" d="M4 11h12.200l-5.600-5.600L12 4l8 8-8 8-1.400-1.400 5.600-5.600H4z"/></symbol>
  </defs>
</svg>

<!-- ============ join ============ -->
<div id="join">
  <span class="circle"></span><span class="arc a"></span><span class="arc b"></span>
  <span class="pill a"></span><span class="pill b"></span>
  <form id="joinCard">
    <svg class="logo"><use href="#logo"/></svg>
    <h1>RAD Chat</h1>
    <label for="nameInput">Your name</label>
    <input id="nameInput" placeholder="e.g. Quincy" maxlength="32" autocomplete="off" autofocus required>
    <button class="btn">Join the chat</button>
    <small>Quality in Information Technology</small>
  </form>
</div>

<!-- ============ app ============ -->
<div id="app" hidden>
  <nav id="rail">
    <button class="rail-btn home" data-tip="RAD Chat" aria-label="RAD Chat"><svg><use href="#logo"/></svg></button>
    <span class="rail-sep"></span>
    <button class="rail-btn" id="railGame" data-tip="RAD Craft" aria-label="Open RAD Craft"><svg><use href="#i-cube"/></svg></button>
  </nav>

  <aside id="sidebar">
    <div class="side-head"><h2>RAD Chat</h2><span>Quality in IT</span></div>
    <div class="side-body">
      <div class="cat">Text channels</div>
      <button class="chan active"><span class="hash">#</span>general</button>
      <div class="cat">Activities</div>
      <button class="chan" id="sideGame"><svg><use href="#i-cube"/></svg>RAD Craft<span class="tag">/game</span></button>
    </div>
    <div class="userbar">
      <div class="av sm" id="meAv"><span class="dot"></span></div>
      <div class="who"><b id="meName"></b><small>Online</small></div>
      <button class="iconbtn" id="changeName" title="Change name" aria-label="Change name">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M3 17.300V21h3.700L17.800 9.900l-3.700-3.700zM20.700 7a1 1 0 0 0 0-1.400l-2.300-2.300a1 1 0 0 0-1.400 0l-1.800 1.800 3.700 3.700z"/></svg>
      </button>
    </div>
  </aside>

  <section id="main">
    <header id="top">
      <button class="iconbtn" id="menuBtn" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>
      <span class="hash">#</span><h1>general</h1>
      <span class="topic">Welcome to RAD Chat. Type /game to play RAD Craft.</span>
      <span class="grow"></span>
      <span id="status" class="off">connecting…</span>
      <button class="iconbtn on" id="toggleMembers" title="Member list" aria-label="Member list"><svg><use href="#i-users"/></svg></button>
    </header>

    <div id="messages"></div>

    <form id="composer" autocomplete="off">
      <div class="box">
        <textarea id="text" rows="1" placeholder="Message #general" maxlength="2000"></textarea>
        <button id="send" aria-label="Send" disabled><svg><use href="#i-send"/></svg></button>
      </div>
      <div class="hint"><kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for a new line · <kbd>/game</kbd> opens RAD Craft</div>
    </form>
  </section>

  <aside id="members">
    <h2>Online — <span id="count">0</span></h2>
    <ul id="users"></ul>
  </aside>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
