<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAD Chat</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --text: #1d2129; --muted: #6b7280;
    --border: #e3e5e9; --accent: #2563eb; --mine: #dbeafe;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --panel: #1a1d23; --text: #e6e8eb; --muted: #8b929c;
            --border: #2a2e36; --accent: #60a5fa; --mine: #1e3a5f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text);
         height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
           display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; }
  #status { font-size: 12px; color: var(--muted); }
  #status.on::before { content: "● "; color: #16a34a; }
  #status.off::before { content: "● "; color: #dc2626; }
  main { flex: 1; display: flex; min-height: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  aside { width: 180px; border-left: 1px solid var(--border); background: var(--panel); padding: 12px 16px;
          overflow-y: auto; }
  aside h2 { font-size: 12px; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; letter-spacing: .04em; }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li { padding: 2px 0; }
  @media (max-width: 600px) { aside { display: none; } }
  .msg { max-width: 75%; padding: 6px 10px; border-radius: 10px; background: var(--panel);
         border: 1px solid var(--border); align-self: flex-start; white-space: pre-wrap; word-wrap: break-word; }
  .msg.mine { align-self: flex-end; background: var(--mine); border-color: transparent; }
  .msg .meta { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .msg .meta b { color: var(--text); margin-right: 6px; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  textarea, input { flex: 1; font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
             background: var(--bg); color: var(--text); resize: none; }
  button { font: inherit; padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  #join { margin: auto; background: var(--panel); padding: 24px; border-radius: 12px; border: 1px solid var(--border);
          display: flex; flex-direction: column; gap: 12px; width: min(320px, 90vw); }
  #join h1 { margin: 0; font-size: 18px; }
</style>
</head>
<body>
<form id="join">
  <h1>RAD Chat</h1>
  <input id="nameInput" placeholder="Your name" maxlength="32" autofocus required>
  <button>Join</button>
</form>

<header hidden id="top">
  <h1>RAD Chat</h1>
  <span id="status" class="off">connecting…</span>
  <span style="flex:1"></span>
  <span id="me" style="font-size:13px;color:var(--muted)"></span>
</header>
<main hidden id="chat">
  <div id="messages"></div>
  <aside><h2>Online</h2><ul id="users"></ul></aside>
</main>
<form hidden id="composer">
  <textarea id="text" rows="1" placeholder="Message (Enter to send, Shift+Enter for newline)" maxlength="2000"></textarea>
  <button>Send</button>
</form>

<script>
  const $ = id => document.getElementById(id);
  let name = localStorage.getItem('radchat-name') || '';
  $('nameInput').value = name;

  const fmtTime = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const atBottom = () => { const m = $('messages'); return m.scrollHeight - m.scrollTop - m.clientHeight < 60; };

  function render(msg) {
    const el = document.createElement('div');
    if (msg.type === 'system') {
      el.className = 'sys';
      el.textContent = `${msg.text} · ${fmtTime(msg.ts)}`;
    } else {
      el.className = 'msg' + (msg.name === name ? ' mine' : '');
      const meta = document.createElement('div');
      meta.className = 'meta';
      const who = document.createElement('b');
      who.textContent = msg.name;
      meta.append(who, fmtTime(msg.ts));
      const body = document.createElement('div');
      body.textContent = msg.text;
      el.append(meta, body);
    }
    $('messages').append(el);
  }

  function notify(msg) {
    if (msg.type !== 'chat' || msg.name === name || !document.hidden) return;
    document.title = '• RAD Chat';
    if (Notification?.permission === 'granted') new Notification(msg.name, { body: msg.text });
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) document.title = 'RAD Chat'; });

  function connect() {
    const es = new EventSource('/events?name=' + encodeURIComponent(name));
    es.onopen = () => { $('status').className = 'on'; $('status').textContent = 'connected'; };
    es.onerror = () => { $('status').className = 'off'; $('status').textContent = 'reconnecting…'; };
    es.addEventListener('history', e => {
      $('messages').replaceChildren();
      JSON.parse(e.data).forEach(render);
      $('messages').scrollTop = $('messages').scrollHeight;
    });
    es.addEventListener('message', e => {
      const stick = atBottom();
      const msg = JSON.parse(e.data);
      render(msg);
      notify(msg);
      if (stick || msg.name === name) $('messages').scrollTop = $('messages').scrollHeight;
    });
    es.addEventListener('users', e => {
      $('users').replaceChildren(...JSON.parse(e.data).map(u => {
        const li = document.createElement('li'); li.textContent = u; return li;
      }));
    });
  }

  $('join').addEventListener('submit', e => {
    e.preventDefault();
    name = $('nameInput').value.trim();
    if (!name) return;
    localStorage.setItem('radchat-name', name);
    $('join').hidden = true;
    $('top').hidden = $('chat').hidden = $('composer').hidden = false;
    $('me').textContent = 'as ' + name;
    if (window.Notification && Notification.permission === 'default') Notification.requestPermission();
    connect();
    $('text').focus();
  });

  $('composer').addEventListener('submit', async e => {
    e.preventDefault();
    const text = $('text').value.trim();
    if (!text) return;
    $('text').value = '';
    await fetch('/send', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                           body: JSON.stringify({ name, text }) });
  });
  $('text').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); }
  });
</script>
</body>
</html>
